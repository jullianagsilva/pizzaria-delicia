<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Detalhes do Pedido</title>
</head>
<body>
<h1>Detalhes do Pedido nº <span th:text="${pedido.numeroPedido}"></span></h1>

<p>Cliente: <span th:text="${pedido.cliente != null ? pedido.cliente.nome : '—'}"></span></p>
<p>Data: <span th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy HH:mm')}"></span></p>

<table border="1">
  <thead>
    <tr>
      <th>Sabor</th>
      <th>Tamanho</th>
      <th>Quantidade</th>
      <th>Preço</th>
      <th>Subtotal</th>
    </tr>
  </thead>
  <tbody>
    <tr th:each="pizza : ${pedido.pizzas}">
      <td th:text="${pizza.sabor}"></td>
      <td th:text="${pizza.tamanho}"></td>
      <td th:text="${pizza.quantidade}"></td>
      <td th:text="${pizza.preco}"></td>
      <td th:text="${pizza.preco * pizza.quantidade}"></td>
    </tr>
  </tbody>
</table>

<p>Taxa de Entrega: R$ <span th:text="${taxaEntrega}"></span></p>
<p>Total Pedido: R$ <span th:text="${totalPedido}"></span></p>

<a th:href="@{/historico}">Voltar</a>
</body>
</html>
