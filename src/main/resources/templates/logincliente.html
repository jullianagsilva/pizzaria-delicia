<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login Cliente - Pizzaria</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body class="login-cliente">
  <div class="login-container">
    <h2>Login Cliente</h2>

    <!-- Mensagem de erro -->
    <div th:if="${erro}" class="erro">
      <p th:text="${erro}"></p>
    </div>

    <!-- Formulário de login -->
    <form th:action="@{/logincliente}" method="post">
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" required autofocus />

      <label for="telefone">Telefone</label>
      <!-- Aceita qualquer telefone internacional -->
      <input type="tel" id="telefone" name="telefone"
             pattern="[\d+\-\s()]{6,20}" 
             placeholder="Ex.: +351 912345678" required />

      <button type="submit">Entrar</button>
    </form>

    <a th:href="@{/}">Voltar à página inicial</a>
  </div>
</body>
</html>
